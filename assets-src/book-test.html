import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const W = 1440, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

{

// seeded random so every render is the same book
let seed = 13; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ---------- desk ----------

// ---------- the pages ----------
const PW = 1024, PH = 1400; // page canvas, portrait

function agedPaper(g, w, h, side) {
  // base: yellowed newsprint, darker towards the edges and the gutter
  g.fillStyle = '#d9c9a0'; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    const ex = Math.min(x, w - x) / w, ey = Math.min(y, h - y) / h;
    const gutter = side === 'L' ? (w - x) / w : x / w; // distance from the spine
    const edge = Math.max(0, 0.09 - Math.min(ex, ey)) * 7;
    const gut = Math.max(0, 0.1 - gutter) * 6;
    const n = (rnd() - 0.5) * 14;
    const k = 0.86 - edge * 0.55 - gut * 0.5 - (rnd() < 0.002 ? 0.2 : 0);
    d[i] = (217 + n) * k + edge * 30; d[i + 1] = (201 + n) * k + edge * 8; d[i + 2] = (160 + n) * k - edge * 25;
  }
  g.putImageData(id, 0, 0);
  // foxing: brown spots
  for (let k = 0; k < 160; k++) {
    const x = rnd() * w, y = rnd() * h, r = 2 + rnd() * rnd() * 22;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(120,70,25,${0.15 + rnd() * 0.3})`); gr.addColorStop(1, 'rgba(120,70,25,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  // water damage tide line
  if (side === 'R') {
    const cx = w * 0.95, cy = h * 1.0, R = w * 0.42;
    const path = () => { g.beginPath(); for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.04) { const rr = R * (0.92 + Math.sin(a * 6) * 0.035 + Math.sin(a * 17) * 0.015); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } };
    g.save(); g.fillStyle = 'rgba(150,110,60,0.10)'; path(); g.fill();
    g.filter = 'blur(2px)'; g.strokeStyle = 'rgba(110,70,30,0.45)'; g.lineWidth = 5; path(); g.stroke();
    g.filter = 'blur(6px)'; g.strokeStyle = 'rgba(120,80,40,0.2)'; g.lineWidth = 18; path(); g.stroke(); g.restore();
  }
}

const SURNAMES = [
  ['ABERNATHY Silas', '13 Hollow Ln', 'HO 6-1313'], ['ACHERON Mrs E', 'The Old Rectory', 'GR 4-0066'], ['ADDER Thos', '9 Wych Elm Rd', 'HO 6-2140'],
  ['ASHBY Constance', 'Flat 4 Gallows Ct', 'BL 2-7709'], ['ASHGROVE Fnrl Parlour', 'Open all night', 'GR 4-1000'], ['BARROW Ezekiel', '7 Cairn St', 'HO 6-5531'],
  ['BELLWEATHER Agnes', 'Mere Cottage', 'BL 2-0909'], ['BLACKTHORN Dr M', 'Surgery, Lychgate Rd', 'GR 4-3317'], ['BONE R', '22 Ossuary Wlk', 'HO 6-8812'],
  ['BRAMBLE Hester', '3 Nightjar Ln', 'BL 2-4420'], ['CADAVER & SONS Cartage', 'Depot, Coffin Rd', 'GR 4-6600'], ['CAIRN Ivor', '18 Barrow Hill', 'HO 6-0131'],
  ['CANDLEMAS Prudence', 'Vestry Hse', 'BL 2-1201'], ['CARRION Wm', '41 Rook St', 'HO 6-7744'], ['CINDER Mabel', 'The Kilns', 'GR 4-2028'],
  ['COFFIN Jas', '5 Elm Row', 'HO 6-3390'], ['CORVID Lenore', 'Rookery Farm', 'BL 2-6113'], ['CROWE Abel', '60 Saltmarsh Rd', 'GR 4-0812'],
  ['CRYPTE Mme', 'Readings by appt', 'HO 6-9999'], ['DANKWORTH Obadiah', '2 Fen End', 'BL 2-3131'], ['DIRGE Florence', '11 Knell St', 'GR 4-5050'],
  ['DOLOR Septimus', 'Asylum Lodge', 'HO 6-1919'], ['DREAD H', '77 Moor Rd', 'BL 2-0013'], ['DUSK Winifred', 'Sundown Villa', 'GR 4-7171'],

];

function listings(g, side) {

  const lh = 26, cols = 3, cw = (PW - x0 - 70 - (cols - 1) * 22) / cols, maxY = side === 'L' ? 990 : PH - 200;
  const perCol = Math.floor((maxY - top) / (lh * 1.9));
  lines.slice(0, perCol * cols).forEach(([name, addr, num], i) => {
    const col = Math.floor(i / perCol), row = i % perCol, colW = cw;

    g.textAlign = 'right'; g.font = 'bold 17px "DejaVu Sans Mono", monospace'; g.fillText(num, x + colW, y + lh * 0.8); g.textAlign = 'left';

    if (rnd() < 0.05 || /ASHGROVE|CADAVER|EVERDARK/.test(name)) {
      // someone crossed this one out in red pen
      g.strokeStyle = 'rgba(120,15,10,0.85)'; g.lineWidth = 3.5; g.beginPath();
      g.moveTo(x - 6, y - 6 + rnd() * 4); g.bezierCurveTo(x + colW * 0.3, y - 10, x + colW * 0.7, y + 12, x + colW + 4, y + 8); g.stroke();
    }
  });

  if (side === 'L') {
    const bx = x0, by = 1020, bw = PW - x0 - 70, bh = 300;
    g.strokeStyle = '#1a140c'; g.lineWidth = 4; g.strokeRect(bx, by, bw, bh);
    g.lineWidth = 1.5; g.strokeRect(bx + 10, by + 10, bw - 20, bh - 20);
    g.fillStyle = '#1a140c'; g.textAlign = 'center';
    g.font = 'bold 54px "DejaVu Serif", serif'; g.fillText('ASHGROVE & DAUGHTERS', bx + bw / 2, by + 85);
    g.font = 'italic 30px "DejaVu Serif", serif'; g.fillText('Undertakers since 1887', bx + bw / 2, by + 130);
    g.font = '26px "DejaVu Sans Condensed", sans-serif';
    g.fillText('Discreet removals  ·  Night calls welcome', bx + bw / 2, by + 180);
    g.fillText('We will come for you.', bx + bw / 2, by + 220);
    g.font = 'bold 40px "DejaVu Sans Mono", monospace'; g.fillText('GR 4-1000', bx + bw / 2, by + 275);
    g.textAlign = 'left';
  }
  // handwritten note in the margin of the right page
  if (side === 'R') {
    g.save(); g.translate(PW - 520, PH - 110); g.rotate(-0.12);
    g.fillStyle = 'rgba(30,30,80,0.85)'; g.font = 'italic 46px "DejaVu Serif", serif';
    g.fillText("don't answer if it", 0, 0); g.fillText('rings at 3am', 30, 52); g.restore();
    // circled number
    
  }
}

function pageTexture(side) {
  const c = document.createElement('canvas'); c.width = PW; c.height = PH; const g = c.getContext('2d');
  agedPaper(g, PW, PH, side);
  // print on its own layer so it can bleed and fade
  const ink = document.createElement('canvas'); ink.width = PW; ink.height = PH; const gi = ink.getContext('2d');
  listings(gi, side);
  g.save(); g.globalAlpha = 0.35; g.filter = 'blur(1.6px)'; g.drawImage(ink, 0, 0); g.restore(); // bleed into the fibres
  g.save(); g.filter = 'blur(0.4px)'; g.drawImage(ink, 0, 0); g.restore();
  // faded and rubbed patches
  for (let k = 0; k < 14; k++) {
    const x = rnd() * PW, y = rnd() * PH, r = 40 + rnd() * 160;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(205,188,145,${0.25 + rnd() * 0.35})`); gr.addColorStop(1, 'rgba(205,188,145,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  g.save(); g.globalCompositeOperation = 'lighten'; for (let k = 0; k < 2500; k++) { g.fillStyle = 'rgba(200,184,140,0.85)'; g.fillRect(rnd() * PW, rnd() * PH, 1 + rnd() * 1.5, 1 + rnd() * 1.5); } g.restore();
  // grime fingerprints near the outer corner
  for (let k = 0; k < 3; k++) {
    const x = side === 'R' ? PW - 120 + rnd() * 40 : 80 + rnd() * 40, y = PH - 200 + rnd() * 80;
    g.save(); g.translate(x, y); g.rotate(rnd() * 3);
    for (let r = 4; r < 34; r += 3) { g.strokeStyle = `rgba(60,40,20,${0.08 + rnd() * 0.05})`; g.lineWidth = 1.4; g.beginPath(); g.ellipse(0, 0, r, r * 1.35, 0, 0, Math.PI * 1.7); g.stroke(); }
    g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}

// a page as a bent sheet: x from spine (0) to edge (1), curved up near the spine
const BOOK_W = 0.21, BOOK_H = 0.28, BLOCK = 0.045;
const pageY = (x) => { const t = Math.abs(x) / BOOK_W; return BLOCK - 0.002 + Math.sqrt(t) * 0.004 - Math.exp(-t * 14) * 0.012; };
function pageGeometry(side) {
  const geo = new THREE.PlaneGeometry(BOOK_W, BOOK_H, 60, 40);
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const u = uv.getX(i); const t = side === 'L' ? 1 - u : u; // t: 0 at spine, 1 at outer edge
    const x = t * BOOK_W;
    // sag into the gutter and a gentle wave
    const y = BLOCK - 0.002 + Math.sqrt(Math.max(0, t)) * 0.004 - Math.exp(-t * 14) * 0.012 + Math.sin(t * 9 + uv.getY(i) * 3) * 0.0006;
    const curlUp = side === 'R' && t > 0.9 && uv.getY(i) < 0.12 ? Math.pow((t - 0.9) * 10, 2) * Math.pow((0.12 - uv.getY(i)) / 0.12, 2) * 0.012 : 0;
    p.setXYZ(i, side === 'L' ? -x : x, y + curlUp, (0.5 - uv.getY(i)) * BOOK_H);
  }
  geo.computeVertexNormals(); return geo;
}

const edgeMat = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 1024; const g = c.getContext('2d');
  for (let y = 0; y < 1024; y++) { const v = 150 + rnd() * 60 - (rnd() < 0.3 ? 70 : 0); g.fillStyle = `rgb(${v},${v * 0.86},${v * 0.6})`; g.fillRect(0, y, 64, 1); }
  // grime along the edges
  const gr = g.createLinearGradient(0, 0, 64, 0); gr.addColorStop(0, 'rgba(60,35,10,0.5)'); gr.addColorStop(0.5, 'rgba(60,35,10,0.1)'); gr.addColorStop(1, 'rgba(60,35,10,0.5)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 1024);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 0.05); t.rotation = Math.PI / 2;
  return new THREE.MeshStandardMaterial({ map: t, roughness: 1, side: THREE.DoubleSide });
})();
const book = new THREE.Group();
for (const side of ['L', 'R']) {
  const m = new THREE.Mesh(pageGeometry(side), new THREE.MeshStandardMaterial({ map: pageTexture(side), roughness: 0.92, side: THREE.DoubleSide }));
  m.castShadow = true; m.receiveShadow = true; book.add(m);

  const prof = new THREE.Shape(); prof.moveTo(0, 0.004);
  for (let k = 0; k <= 60; k++) { const t = k / 60; prof.lineTo(t * BOOK_W, BLOCK - 0.0035 + Math.sqrt(t) * 0.004 - Math.exp(-t * 14) * 0.012); }
  prof.lineTo(BOOK_W, 0.004); prof.lineTo(0, 0.004);
  const bg = new THREE.ExtrudeGeometry(prof, { depth: BOOK_H * 0.995, bevelEnabled: false, steps: 1 });
  bg.translate(0, 0, -BOOK_H * 0.995 / 2); if (side === 'L') bg.scale(-1, 1, 1);
  const block = new THREE.Mesh(bg, [new THREE.MeshStandardMaterial({ color: 0x8a7a58, roughness: 1, side: THREE.DoubleSide }), edgeMat]);
  block.castShadow = true; block.receiveShadow = true; book.add(block);
}
// cover boards, worn cloth
{
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#3d1a12'; g.fillRect(0, 0, 512, 512);
  for (let k = 0; k < 9000; k++) { g.fillStyle = `rgba(${rnd() < 0.5 ? '0,0,0' : '120,80,50'},${rnd() * 0.12})`; g.fillRect(rnd() * 512, rnd() * 512, 1 + rnd() * 3, 1); }
  for (let k = 0; k < 30; k++) { g.fillStyle = `rgba(150,110,70,${rnd() * 0.25})`; g.beginPath(); g.arc(rnd() * 512, rnd() * 512, rnd() * 40, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const coverMat = new THREE.MeshStandardMaterial({ map: t, roughness: 0.95 });
  for (const s of [-1, 1]) {
    const cv = new THREE.Mesh(new THREE.BoxGeometry(BOOK_W + 0.012, 0.004, BOOK_H + 0.012), coverMat);
    cv.position.set(s * (BOOK_W / 2 + 0.004), 0.002, 0); cv.castShadow = true; cv.receiveShadow = true; book.add(cv);

}
book.rotation.y = 0.12;
scene.add(book);

// ---------- dead moth pressed on the right page ----------
{
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.translate(128, 128);
  // dust smear where it was squashed
  g.filter = 'blur(10px)'; g.fillStyle = 'rgba(80,68,52,0.35)'; g.beginPath(); g.ellipse(0, 8, 115, 70, 0, 0, 7); g.fill(); g.filter = 'none';
  const wing = (s, fore) => {

    const len = fore ? 112 : 78, rot = fore ? -0.12 : 0.85, wid = fore ? 46 : 52;
    g.rotate(rot);
    g.beginPath(); g.moveTo(0, -4);
    g.bezierCurveTo(len * 0.35, -wid * 0.9, len * 0.95, -wid * 0.7, len, -wid * 0.15);

    g.fillStyle = fore ? '#3f372e' : '#352e27'; g.fillRect(-10, -wid * 1.2, len + 20, wid * 2.4);
    for (let k = 0; k < 900; k++) { const v = 35 + rnd() * 55; g.fillStyle = `rgba(${v + 12},${v + 6},${v - 4},0.45)`; g.fillRect(rnd() * len, (rnd() - 0.6) * wid * 1.6, 2, 1.2); }

  g.save(); g.scale(-1, 1); g.rotate(-0.12); g.fillStyle = '#4e463b'; g.beginPath(); g.moveTo(0, -4); g.lineTo(34, -26); g.lineTo(28, 2); g.lineTo(40, 12); g.lineTo(0, 10); g.fill(); g.restore();

  g.fillStyle = '#2a221b'; g.beginPath(); g.ellipse(0, -28, 9, 10, 0, 0, 7); g.fill(); g.filter = 'none';
  g.strokeStyle = '#2a221b'; g.lineWidth = 1.5;
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 3, -36); g.quadraticCurveTo(s * 18, -70, s * 34, -84); g.stroke();

// ---------- a centipede crawling out of the gutter ----------
